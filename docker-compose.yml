services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-freelance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-freelance}
      POSTGRES_DB: ${POSTGRES_DB:-freelance_agent}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-freelance} -d ${POSTGRES_DB:-freelance_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    network_mode: host
    command: ["redis-server", "--save", "", "--appendonly", "no", "--bind", "127.0.0.1"]

  app:
    build:
      context: .
      network: host
    restart: unless-stopped
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      FREELANCE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-freelance}:${POSTGRES_PASSWORD:-freelance}@127.0.0.1:5432/${POSTGRES_DB:-freelance_agent}
      FREELANCE_REDIS_URL: redis://127.0.0.1:6379/0
    volumes:
      - ./frontend:/app/frontend
      - ./backend:/app/backend

volumes:
  pgdata:
